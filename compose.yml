name: e-synthese-dev

# Ce compose.yml fait tourner toute la stack E-Synthèse en local (dev) :
#   - Mastra (RAG proxy, port 4111) construit depuis ./mastra/Dockerfile.dev
#   - Conversations (frontend Next.js + backend Django) avec digests pinnés
#   - Postgres / Redis / MinIO / Keycloak / Maildev / nginx (reverse-proxy auth)
#
# Premier démarrage : ./scripts/bootstrap.sh (génère .env, llm.json, lance tout)
# Démarrages suivants : docker compose up -d

services:
  # ───────────────────────── Mastra (RAG proxy) ─────────────────────────
  mastra:
    build:
      context: ./mastra
      dockerfile: Dockerfile.dev
    volumes:
      # Bind mount du code source = hot reload (mastra dev recompile automatiquement)
      - ./mastra/src:/app/src
      - ./mastra/public:/app/public
      # SQLite persistante via volume nommé
      - mastra_data:/app/data
    env_file:
      - .env
    ports:
      - "4111:4111"
    networks:
      - default
      - lasuite
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4111/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ───────────────────────── Conversations stack ─────────────────────────
  postgresql:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 60
      # Postgres met parfois 30+ secondes à recover un WAL résiduel après
      # un crash sale. start_period laisse cette fenêtre sans compter les
      # échecs comme retries.
      start_period: 60s
    env_file:
      - ./front-back/env.d/development/postgresql

  redis:
    image: redis:5

  maildev:
    image: maildev/maildev:latest
    ports:
      - "1081:1080"

  minio:
    user: ${DOCKER_USER:-1000}
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=conversations
      - MINIO_ROOT_PASSWORD=password
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 20s
      retries: 300
    entrypoint: ""
    command: minio server --console-address :9001 /data
    volumes:
      # Bind mount (et non named volume) car MinIO tourne en uid 1000 et
      # un named volume frais est créé en root:root → file access denied.
      # Le dossier data/ est gitignored.
      - ./data/media:/data

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
        restart: true
    entrypoint: >
      sh -c "
      /usr/bin/mc alias set conversations http://minio:9000 conversations password &&
      /usr/bin/mc mb -p conversations/conversations-media-storage &&
      /usr/bin/mc version enable conversations/conversations-media-storage &&
      exit 0;"

  app-dev:
    # Digest pinné de l'image upstream lasuite/conversations-backend:main au 2026-04-16.
    # Pour bumper : docker manifest inspect lasuite/conversations-backend:main, prendre le
    # digest amd64, remplacer ci-dessous, tester, commiter.
    image: lasuite/conversations-backend:main@sha256:337516bd02be0e93e5720016bc8c8faab9df263e33931e76d7a015a4e48f2613
    platform: linux/amd64
    environment:
      - DJANGO_CONFIGURATION=LocalDev
      - DJANGO_SETTINGS_MODULE=conversations.local_settings
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:3000,http://localhost:8071
      - LLM_CONFIGURATION_FILE_PATH=/app/conversations/configuration/llm/custom.json
    env_file:
      - ./front-back/env.d/development/common
      - ./front-back/env.d/development/postgresql
    extra_hosts:
      # Conservé pour compat scripts qui référencent host.docker.internal.
      # En interne, app-dev appelle mastra:4111 via le réseau Docker.
      - "host.docker.internal:host-gateway"
    ports:
      - "8071:8000"
    volumes:
      - ./front-back/docker/patches/local_settings.py:/app/conversations/local_settings.py:ro
      - ./front-back/docker/patches/llm.json:/app/conversations/configuration/llm/custom.json:ro
    networks:
      - default
      - lasuite
    depends_on:
      mastra:
        condition: service_healthy
      postgresql:
        condition: service_healthy
        restart: true
      maildev:
        condition: service_started
      redis:
        condition: service_started
      createbuckets:
        condition: service_started

  nginx:
    image: nginx:1.25
    ports:
      - "8083:8083"
    networks:
      - default
      - lasuite
    volumes:
      - ./front-back/docker/files/etc/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      app-dev:
        condition: service_started
      keycloak:
        condition: service_healthy
        restart: true

  frontend-development:
    image: lasuite/conversations-frontend:main@sha256:b204d0cfd2fef583947b5831e0ff6e026b003c64fd596a02ec999d036dffa6fb
    platform: linux/amd64
    ports:
      - "3000:3000"
    volumes:
      - ./front-back/docker/files/etc/nginx/conf.d/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-dev

  kc_postgresql:
    image: postgres:17.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 60s
    env_file:
      - ./front-back/env.d/development/kc_postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    volumes:
      - ./front-back/docker/auth/realm.json:/opt/keycloak/data/import/realm.json
    command:
      - start-dev
      - --features=preview
      - --import-realm
      - --proxy=edge
      - --hostname=http://localhost:8083
      - --hostname-strict=false
      - --health-enabled=true
      - --metrics-enabled=true
      - --http-enabled=true
    healthcheck:
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { java.net.URI uri = java.net.URI.create(args[0]); System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)uri.toURL().openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/health/live']
      start_period: 10s
      interval: 1s
      timeout: 2s
      retries: 300
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: kc_postgresql
      KC_DB_URL_DATABASE: keycloak
      KC_DB_PASSWORD: pass
      KC_DB_USERNAME: conversations
      KC_DB_SCHEMA: public
      PROXY_ADDRESS_FORWARDING: 'true'
    depends_on:
      kc_postgresql:
        condition: service_healthy
        restart: true

volumes:
  mastra_data:

networks:
  lasuite:
    name: lasuite-network
    driver: bridge
