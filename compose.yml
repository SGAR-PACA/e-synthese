name: e-synthese-prod

# =============================================================================
# Configuration PRODUCTION pour Dokploy (OVH/Scaleway)
#
# Différences clés vs E-synthese-final-dev :
#  - Pas de ports exposés sauf via Traefik (géré par Dokploy)
#  - restart: always partout
#  - Mastra : image GHCR pinnée par digest (TODO une fois la CI publiée)
#  - Django : DJANGO_CONFIGURATION=Production (pas de local_settings.py)
#  - llm.json rendu via envsubst au démarrage (depuis llm.json.tpl)
#  - Named volumes durables pour Postgres / Mastra / Keycloak / MinIO
#
# Variables d'env attendues (voir .env.example.prod) :
#  DOMAIN_FRONT (domaine unique : front /, Keycloak /auth, admin Mastra /admin),
#  ALBERT_API_KEY, PROXY_API_KEY,
#  ENCRYPTION_KEY, DJANGO_SECRET_KEY, OIDC_RP_CLIENT_SECRET,
#  POSTGRES_PASSWORD, KC_DB_PASSWORD, KEYCLOAK_ADMIN_PASSWORD,
#  AWS_S3_SECRET_ACCESS_KEY, EMAIL_HOST, EMAIL_USER, EMAIL_PASSWORD
# =============================================================================

services:
  # ───────────────────────── Mastra (RAG proxy) ─────────────────────────
  mastra:
    # Mode définitif : image immutable depuis GHCR (à activer une fois la CI
    # GitHub Actions opérationnelle).
    # image: ghcr.io/${REPO_OWNER}/e-synthese-mastra@sha256:REPLACE_WITH_DIGEST
    #
    # Mode transitoire : build local depuis le dossier mastra/ synchronisé.
    # À utiliser pour le premier déploiement, en attendant la CI.
    build:
      context: ./mastra
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PROXY_API_KEY=${PROXY_API_KEY:?PROXY_API_KEY requis}
      - ALBERT_API_KEY=${ALBERT_API_KEY:?ALBERT_API_KEY requis}
      - ALBERT_API_BASE_URL=${ALBERT_API_BASE_URL:-https://albert.api.etalab.gouv.fr}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY requis}
      - LLM_MODEL=${LLM_MODEL:-albert-large}
      # Taux d'échantillonnage de la notation LIVE (0 = désactivé). Albert plafonne
      # à 10 req/min ; à 1.0 l'éval (~4-5 appels juge/réponse) sature le quota → 429
      # sur le chat ET l'upload de documents. Doit être mappé ici pour atteindre le conteneur.
      - EVAL_SAMPLING_RATE=${EVAL_SAMPLING_RATE:-1.0}
      - PORT=4111
      - DATABASE_URL=postgresql://mastra:${MASTRA_DB_PASSWORD:?MASTRA_DB_PASSWORD requis}@mastra_postgresql:5432/mastra
      # --- Visionneuse de sources (phase Ingestion) ---
      # Le worker d'ingestion ne démarre que si S3_DOCS_BUCKET est renseigné (cf. index.ts).
      - OCR_SERVICE_URL=http://ocr:8080
      - S3_DOCS_ENDPOINT=${S3_DOCS_ENDPOINT:-https://s3.fr-par.scw.cloud}
      - S3_DOCS_REGION=${S3_DOCS_REGION:-fr-par}
      - S3_DOCS_BUCKET=${S3_DOCS_BUCKET:-}
      - S3_DOCS_ACCESS_KEY=${S3_DOCS_ACCESS_KEY:-}
      - S3_DOCS_SECRET_KEY=${S3_DOCS_SECRET_KEY:-}
      # --- Auth visionneuse de sources (OIDC + clés HMAC) — valeurs renseignées dans Dokploy ---
      # ISSUER / REDIRECT_URI dépendent du domaine : à renseigner en entier dans Dokploy, ex :
      #   MASTRA_OIDC_ISSUER=https://<DOMAIN_FRONT>/auth/realms/conversations
      #   MASTRA_OIDC_REDIRECT_URI=https://<DOMAIN_FRONT>/v1/source/callback
      # Tant que MASTRA_SOURCE_LINK_KEY est vide, aucun lien de source n'est généré (dégradation douce).
      - MASTRA_OIDC_ISSUER=${MASTRA_OIDC_ISSUER:-https://${DOMAIN_FRONT}/auth/realms/conversations}
      - MASTRA_OIDC_INTERNAL_URL=${MASTRA_OIDC_INTERNAL_URL:-http://keycloak:8080/auth/realms/conversations}
      - MASTRA_OIDC_CLIENT_ID=${MASTRA_OIDC_CLIENT_ID:-mastra-sources}
      - MASTRA_OIDC_CLIENT_SECRET=${MASTRA_OIDC_CLIENT_SECRET:-}
      - MASTRA_OIDC_REDIRECT_URI=${MASTRA_OIDC_REDIRECT_URI:-}
      - MASTRA_RP_COOKIE_KEY=${MASTRA_RP_COOKIE_KEY:-}
      - MASTRA_SOURCE_LINK_KEY=${MASTRA_SOURCE_LINK_KEY:-}
      # --- Notation utilisateur (widget 5 étoiles) ---
      # MASTRA_RATING_AUDIENCE doit valoir l'id du client public Keycloak (mastra-rating-spa),
      # sinon requireRatingUser renvoie 503 « Notation non configurée ». Réutilise MASTRA_OIDC_ISSUER
      # et MASTRA_OIDC_INTERNAL_URL ci-dessus. CORS optionnel : seulement si le front et Mastra sont
      # sur des domaines différents (ici same-origin via Traefik PathPrefix /v1, donc laissé vide).
      - MASTRA_RATING_AUDIENCE=${MASTRA_RATING_AUDIENCE:-mastra-rating-spa}
      - MASTRA_RATING_CORS_ORIGIN=${MASTRA_RATING_CORS_ORIGIN:-}
    mem_limit: 2g
    depends_on:
      mastra_postgresql:
        condition: service_healthy
        restart: true
      ocr:
        condition: service_started
    networks:
      - default
      - lasuite
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4111/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # Domaine unique : Mastra servi par chemin sous ${DOMAIN_FRONT}.
      # /admin (UI + API admin) et /v1 (collections, documents, chat-completions) → Mastra,
      # SANS StripPrefix (Mastra sert nativement ces chemins). Priorité > routeur front (catch-all).
      - "traefik.http.routers.mastra.rule=Host(`${DOMAIN_FRONT}`) && (PathPrefix(`/admin`) || PathPrefix(`/v1`))"
      - "traefik.http.routers.mastra.entrypoints=websecure"
      - "traefik.http.routers.mastra.tls=true"
      - "traefik.http.routers.mastra.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mastra.priority=100"
      - "traefik.http.services.mastra.loadbalancer.server.port=4111"

  ocr:
    build: ./ocr-service
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    networks:
      - internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  mastra_postgresql:
    image: postgres:17.5
    restart: always
    environment:
      - POSTGRES_PASSWORD=${MASTRA_DB_PASSWORD:?MASTRA_DB_PASSWORD requis}
    env_file:
      - ./front-back/env.d/production/mastra_postgresql
    volumes:
      - mastra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ───────────────────── Sauvegarde quotidienne vers S3 ─────────────────────
  mastra_backup:
    build:
      context: ./front-back/docker/backup
    restart: always
    environment:
      - MASTRA_DB_PASSWORD=${MASTRA_DB_PASSWORD:?MASTRA_DB_PASSWORD requis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD:?KC_DB_PASSWORD requis}
      - BACKUP_S3_ACCESS_KEY=${BACKUP_S3_ACCESS_KEY:?BACKUP_S3_ACCESS_KEY requis}
      - BACKUP_S3_SECRET_KEY=${BACKUP_S3_SECRET_KEY:?BACKUP_S3_SECRET_KEY requis}
    env_file:
      - ./front-back/env.d/production/backup
    depends_on:
      mastra_postgresql:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      kc_postgresql:
        condition: service_healthy

  # ───────────────────────── Conversations stack ─────────────────────────
  postgresql:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    env_file:
      - ./front-back/env.d/production/postgresql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:5
    restart: always
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    restart: always
    environment:
      - MINIO_ROOT_USER=conversations
      - MINIO_ROOT_PASSWORD=${AWS_S3_SECRET_ACCESS_KEY:?AWS_S3_SECRET_ACCESS_KEY requis}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    entrypoint: ""
    command: minio server /data
    volumes:
      - minio_data:/data
    # Pas de ports: console MinIO non exposée par défaut.
    # Pour y accéder : ajouter des labels Traefik ci-dessous, ou tunnel SSH.

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
        restart: true
    environment:
      - MINIO_PASSWORD=${AWS_S3_SECRET_ACCESS_KEY}
    entrypoint: >
      sh -c "
      /usr/bin/mc alias set conversations http://minio:9000 conversations $$MINIO_PASSWORD &&
      /usr/bin/mc mb -p conversations/conversations-media-storage &&
      /usr/bin/mc version enable conversations/conversations-media-storage &&
      exit 0;"
    restart: on-failure

  app-dev:
    image: lasuite/conversations-backend:main@sha256:337516bd02be0e93e5720016bc8c8faab9df263e33931e76d7a015a4e48f2613
    platform: linux/amd64
    restart: always
    environment:
      - DJANGO_CONFIGURATION=Production
      - DJANGO_SETTINGS_MODULE=conversations.settings
      - DJANGO_ALLOWED_HOSTS=${DOMAIN_FRONT}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY requis}
      - DJANGO_CSRF_TRUSTED_ORIGINS=https://${DOMAIN_FRONT}
      - LLM_CONFIGURATION_FILE_PATH=/tmp/llm-custom.json

      # Mail
      - DJANGO_EMAIL_BRAND_NAME=${DJANGO_EMAIL_BRAND_NAME:-E-Synthèse}
      - DJANGO_EMAIL_HOST=${EMAIL_HOST:?EMAIL_HOST requis}
      - DJANGO_EMAIL_PORT=${EMAIL_PORT:-587}
      - DJANGO_EMAIL_HOST_USER=${EMAIL_USER}
      - DJANGO_EMAIL_HOST_PASSWORD=${EMAIL_PASSWORD}
      - DJANGO_EMAIL_USE_TLS=true
      - DJANGO_EMAIL_LOGO_IMG=https://${DOMAIN_FRONT}/assets/logo-suite-numerique.png

      # Backend / Media URLs
      - CONVERSATIONS_BASE_URL=https://${DOMAIN_FRONT}
      - MEDIA_BASE_URL=https://${DOMAIN_FRONT}
      - AWS_S3_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY}

      # OIDC
      - OIDC_OP_AUTHORIZATION_ENDPOINT=https://${DOMAIN_FRONT}/auth/realms/conversations/protocol/openid-connect/auth
      - OIDC_RP_CLIENT_SECRET=${OIDC_RP_CLIENT_SECRET:?OIDC_RP_CLIENT_SECRET requis}
      - LOGIN_REDIRECT_URL=https://${DOMAIN_FRONT}
      - LOGIN_REDIRECT_URL_FAILURE=https://${DOMAIN_FRONT}
      - LOGOUT_REDIRECT_URL=https://${DOMAIN_FRONT}
      - OIDC_REDIRECT_ALLOWED_HOSTS=["https://${DOMAIN_FRONT}"]

      # Pour envsubst (le command ci-dessous)
      - PROXY_API_KEY=${PROXY_API_KEY}

      # Connexion Postgres (le service postgresql crée l'user avec POSTGRES_PASSWORD,
      # Django doit avoir ce même password pour s'y connecter)
      - DB_PASSWORD=${POSTGRES_PASSWORD}

    env_file:
      - ./front-back/env.d/production/common
      - ./front-back/env.d/production/postgresql
    volumes:
      # Le template est en :ro ; le rendu final est écrit dans /tmp/llm-custom.json
      # (writable par le user non-root du container, à la différence de /app/...)
      - ./front-back/docker/patches/llm.json.tpl:/tmpl/llm.json.tpl:ro
    # On override ENTRYPOINT pour rendre le template avant le démarrage Django,
    # puis on appelle l'entrypoint d'origine avec les args du CMD ci-dessous.
    # Note : quand on override entrypoint dans compose, le CMD de l'image est reset → on doit
    # le redéclarer explicitement (ici uvicorn pour Conversations ASGI).
    entrypoint:
      - sh
      - -c
      - |
        set -e
        # 1. Rendu du template LLM via Python (placeholder __PROXY_API_KEY__).
        python3 -c "
        import os
        template = open('/tmpl/llm.json.tpl').read()
        output = template.replace('__PROXY_API_KEY__', os.environ['PROXY_API_KEY'])
        open('/tmp/llm-custom.json', 'w').write(output)
        print('llm-custom.json rendu dans /tmp/')
        "
        # 2. Migrations Django (idempotent : skip si déjà à jour)
        # depends_on: postgresql healthy garantit que la DB est joignable.
        # --no-input pour ne pas hanger sur une question interactive.
        echo "[entrypoint] Running Django migrations..."
        cd /app && python manage.py migrate --no-input
        echo "[entrypoint] Migrations OK."
        # 3. Lancer l'entrypoint d'origine (qui exec uvicorn)
        exec /usr/local/bin/entrypoint "$$@"
      - --
    command:
      - uvicorn
      - --app-dir=/app
      - --host=0.0.0.0
      - --timeout-graceful-shutdown=300
      - --limit-max-requests=20000
      - --lifespan=off
      # --proxy-headers : uvicorn lit X-Forwarded-Proto/For et adapte le scope ASGI
      # --forwarded-allow-ips=* : accepte ces headers de n'importe quel proxy upstream
      # (sécurisé ici car nginx frontend est le seul appelant + Traefik termine TLS)
      - --proxy-headers
      - --forwarded-allow-ips=*
      - conversations.asgi:application
    networks:
      - default
      - lasuite
    depends_on:
      mastra:
        condition: service_healthy
      postgresql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started
      createbuckets:
        condition: service_started
    # Backend : non exposé directement — Conversations frontend lui parle via
    # le proxy nginx interne (frontend.conf monté ci-dessous).

  frontend-development:
    build:
      context: ./conversations-frontend
      dockerfile: src/frontend/Dockerfile
      target: frontend-production
      args:
        API_ORIGIN: https://${DOMAIN_FRONT}
        PRODUCT_NAME: ${PRODUCT_NAME:-Assistant}
        KEYCLOAK_URL: https://${DOMAIN_FRONT}/auth
        KEYCLOAK_REALM: conversations
        RATING_CLIENT_ID: mastra-rating-spa
        # Mastra est servi sous le même domaine que le front (PathPrefix /admin et /v1)
        RATING_API_URL: https://${DOMAIN_FRONT}
    restart: always
    volumes:
      - ./front-back/docker/files/etc/nginx/conf.d/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - lasuite
      - dokploy-network
    depends_on:
      - app-dev
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.front.rule=Host(`${DOMAIN_FRONT}`)"
      - "traefik.http.routers.front.entrypoints=websecure"
      - "traefik.http.routers.front.tls=true"
      - "traefik.http.routers.front.tls.certresolver=letsencrypt"
      - "traefik.http.services.front.loadbalancer.server.port=3000"

  kc_postgresql:
    image: postgres:17.5
    restart: always
    environment:
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD:?KC_DB_PASSWORD requis}
    env_file:
      - ./front-back/env.d/production/kc_postgresql
    volumes:
      - kc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: always
    volumes:
      # Template du realm : les `__DOMAIN_FRONT__` sont substitués par sed au
      # boot du conteneur (voir `command` ci-dessous) et le résultat est écrit
      # dans /opt/keycloak/data/import/realm.json (volume nommé keycloak_data),
      # avant de lancer Keycloak avec --import-realm.
      # L'import n'a lieu qu'au premier boot ; les changements ultérieurs
      # passent par l'admin UI Keycloak ou par un reset du volume keycloak_data.
      - ./front-back/docker/auth/realm.prod.json.tpl:/tmp/realm.prod.json.tpl:ro
      - keycloak_data:/opt/keycloak/data
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/keycloak/data/import
        sed "s|__DOMAIN_FRONT__|${DOMAIN_FRONT}|g" /tmp/realm.prod.json.tpl > /opt/keycloak/data/import/realm.json
        exec /opt/keycloak/bin/kc.sh start \
          --import-realm \
          --proxy-headers=xforwarded \
          --hostname=https://${DOMAIN_FRONT}/auth \
          --hostname-strict=false \
          --health-enabled=true \
          --metrics-enabled=true \
          --http-enabled=true
    healthcheck:
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { java.net.URI uri = java.net.URI.create(args[0]); System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)uri.toURL().openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/auth/health/live']
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 60
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD requis}
      KC_DB: postgres
      KC_DB_URL_HOST: kc_postgresql
      KC_DB_URL_DATABASE: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_USERNAME: keycloak
      KC_DB_SCHEMA: public
      PROXY_ADDRESS_FORWARDING: 'true'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'false'
      # Domaine unique : Keycloak servi sous /auth (front-channel ET back-channel).
      KC_HTTP_RELATIVE_PATH: /auth
    networks:
      - default
      - lasuite
      - dokploy-network
    depends_on:
      kc_postgresql:
        condition: service_healthy
        restart: true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.auth.rule=Host(`${DOMAIN_FRONT}`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.routers.auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.auth.priority=100"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"

  # Provisionne Keycloak à chaque déploiement, de façon idempotente. Deux rôles :
  #  1. force `registrationAllowed=false` sur le realm (ferme l'auto-inscription) ;
  #  2. crée le client public `mastra-rating-spa` (notation) s'il est absent.
  # Nécessaire car l'import du realm (realm.prod.json.tpl) ne rejoue qu'au tout
  # premier boot : ce service couvre aussi les instances déjà initialisées, et
  # re-ferme l'inscription même si elle a été réactivée à la main dans la console.
  keycloak-provision-rating:
    image: quay.io/keycloak/keycloak:26.3
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD requis}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        KCADM=/opt/keycloak/bin/kcadm.sh
        CFG=/tmp/kcadm-rating.config
        REALM=conversations
        CID=mastra-rating-spa
        # Attendre que l'API admin Keycloak réponde (jusqu'à ~60 s).
        n=0
        until "$$KCADM" config credentials --config "$$CFG" \
                --server http://keycloak:8080/auth --realm master \
                --user admin --password "$$KEYCLOAK_ADMIN_PASSWORD" 2>/dev/null; do
          n=$$((n+1)); [ "$$n" -ge 20 ] && { echo "Keycloak injoignable."; exit 1; }
          echo "Keycloak pas encore prêt (tentative $$n)…"; sleep 3
        done
        # Sécurité : ferme l'auto-inscription du realm (idempotent, ré-appliqué à
        # chaque déploiement). Corrige aussi une éventuelle réactivation en console.
        "$$KCADM" update realms/$$REALM --config "$$CFG" -s registrationAllowed=false
        echo "Auto-inscription desactivee (registrationAllowed=false)."
        # Crée le client public s'il est absent.
        ID=$$("$$KCADM" get clients --config "$$CFG" -r "$$REALM" -q clientId="$$CID" --fields id --format csv --noquotes 2>/dev/null | tr -d '\r' || true)
        if [ -z "$$ID" ]; then
          "$$KCADM" create clients --config "$$CFG" -r "$$REALM" \
            -s clientId="$$CID" -s enabled=true -s protocol=openid-connect \
            -s publicClient=true -s standardFlowEnabled=true \
            -s implicitFlowEnabled=false -s directAccessGrantsEnabled=false \
            -s 'redirectUris=["https://${DOMAIN_FRONT}/*"]' \
            -s 'webOrigins=["https://${DOMAIN_FRONT}"]' \
            -s 'attributes."pkce.code.challenge.method"=S256'
          echo "Client $$CID cree."
        else
          echo "Client $$CID deja present."
        fi
        ID=$$("$$KCADM" get clients --config "$$CFG" -r "$$REALM" -q clientId="$$CID" --fields id --format csv --noquotes | tr -d '\r')
        # Ajoute le mapper d'audience (aud=mastra-rating-spa) s'il est absent.
        if ! "$$KCADM" get clients/$$ID/protocol-mappers/models --config "$$CFG" -r "$$REALM" --fields name --format csv --noquotes 2>/dev/null | grep -q audience-mastra-rating; then
          "$$KCADM" create clients/$$ID/protocol-mappers/models --config "$$CFG" -r "$$REALM" \
            -s name=audience-mastra-rating -s protocol=openid-connect \
            -s protocolMapper=oidc-audience-mapper \
            -s 'config."included.client.audience"=mastra-rating-spa' \
            -s 'config."access.token.claim"=true' \
            -s 'config."id.token.claim"=false'
          echo "Mapper d audience cree."
        else
          echo "Mapper d audience deja present."
        fi
        echo "OK: notation Keycloak provisionnee."
    networks:
      - default
      - lasuite

# Pas de service maildev en prod (utiliser un vrai SMTP via EMAIL_HOST).
