<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — E-Synthèse Admin</title>
<link rel="stylesheet" href="/admin/style.css">
<style>
/* Page Notes — composants du tableau de bord. Le thème (verre fin, Bleu France,
   Marianne, sidebar) vient de /admin/style.css ; ici seulement le spécifique.
   Pico n'est volontairement PAS chargé : cette page est entièrement custom. */
:root { --gold: #b88a00; }

h1 { font-size: clamp(1.45rem, 2.4vw, 1.8rem); margin: 0 0 .25rem; font-weight: 700; color: var(--ink); letter-spacing: -.018em; }
.sub { color: var(--ink-faint); font-size: .82rem; margin: 0 0 1.6rem; }

/* Surfaces de verre fines (alignées sur les <article>) */
.card, .list, .detail {
  background: var(--surface);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--edge); border-radius: var(--radius); box-shadow: var(--shadow), var(--hi);
}
.card { padding: 1.15rem 1.25rem; }

/* KPIs */
.kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1rem; }
.kpi .label { color:var(--ink-faint); font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
.kpi .val { font-size:1.75rem; font-weight:700; margin-top:.45rem; color:var(--ink); line-height:1.05; letter-spacing:-.02em; }
.kpi .val small { font-size:.85rem; font-weight:600; color:var(--ink-faint); letter-spacing:0; }
.trendpill { font-size:.74rem; margin-top:.5rem; color:var(--ink-faint); }
.trendpill.up { color:var(--good); } .trendpill.down { color:var(--bad); }

/* Graphiques */
.charts { display:grid; grid-template-columns:1fr 1.3fr; gap:1rem; margin-bottom:1.5rem; }
.card h3 { margin:0 0 1.1rem; font-size:.7rem; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.07em; }
.distrow { display:flex; align-items:center; gap:.8rem; margin:.7rem 0; }
.distrow .lab { width:26px; color:var(--gold); font-size:.8rem; font-weight:600; }
.bar { flex:1; height:8px; background:rgba(20,20,60,.07); border-radius:var(--radius-pill); overflow:hidden; }
.bar > i { display:block; height:100%; border-radius:var(--radius-pill); background:var(--accent); transition:width .45s cubic-bezier(.22,.61,.36,1); }
.distrow .cnt { width:28px; text-align:right; color:var(--ink-faint); font-variant-numeric:tabular-nums; font-size:.8rem; }
.spark { width:100%; height:148px; display:block; }

/* Barre d'outils */
.toolbar { display:flex; gap:.7rem; margin-bottom:.9rem; align-items:center; flex-wrap:wrap; }
.seg { display:inline-flex; gap:2px; padding:3px; background:var(--surface); border:1px solid var(--edge); border-radius:var(--radius-md); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--hi); }
.seg button { width:auto; background:transparent; border:0; color:var(--ink-faint); padding:.42rem .85rem; font:inherit; font-size:.82rem; font-weight:500; cursor:pointer; border-radius:6px; box-shadow:none; transition:background .15s, color .15s; }
.seg button:hover { background:transparent; color:var(--accent); }
.seg button.on { background:var(--accent); color:#fff; box-shadow:none; }
.search { flex:1; min-width:200px; width:auto; font:inherit; font-size:.85rem; color:var(--ink) !important; background:var(--surface) !important; -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--edge) !important; border-radius:var(--radius-md) !important; padding:.62rem .9rem; outline:none; box-shadow:var(--hi); }
.search::placeholder { color:var(--ink-ghost); }
.search:focus { border-color:var(--accent) !important; box-shadow:0 0 0 3px rgba(0,0,145,.14) !important; }

/* Maître / détail */
.md { display:grid; grid-template-columns:330px 1fr; gap:1rem; align-items:start; }
.list { overflow:hidden; max-height:680px; overflow-y:auto; padding:.3rem; }
.item { padding:.7rem .8rem; border-radius:var(--radius-sm); cursor:pointer; display:flex; gap:.7rem; transition:background .14s; }
.item + .item { margin-top:2px; }
.item:hover { background:rgba(255,255,255,.6); }
.item.on { background:var(--blue-975); box-shadow:inset 2px 0 0 var(--accent); }
.avatar { width:32px; height:32px; border-radius:9px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:600; color:#fff; }
.item .who { font-size:.82rem; font-weight:600; color:var(--ink); }
.item .meta { color:var(--ink-faint); font-size:.72rem; }
.item .snip { color:var(--ink-faint); font-size:.74rem; margin-top:2px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
.stars { letter-spacing:.5px; font-size:.78rem; white-space:nowrap; }
.stars .f { color:var(--gold); } .stars .e { color:#d2d3da; }

/* Détail */
.dhead { padding:1.3rem 1.5rem 0; }
.dhead .top { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; }
.who2 { font-weight:700; font-size:.98rem; color:var(--ink); }
.meta2 { color:var(--ink-faint); font-size:.78rem; margin-top:.15rem; display:flex; align-items:center; gap:.45rem; }
.bigstars { font-size:1.3rem; letter-spacing:2px; }
.tabs { display:flex; gap:1.2rem; margin-top:1.1rem; border-bottom:1px solid var(--hairline); }
.tabs button { width:auto; background:none; border:0; color:var(--ink-faint); padding:.65rem 0; font:inherit; font-size:.84rem; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; border-radius:0; box-shadow:none; transition:color .15s, border-color .15s; }
.tabs button:hover { color:var(--accent); background:none; }
.tabs button.on { color:var(--accent); border-bottom-color:var(--accent); }
.pane { padding:1.3rem 1.5rem 1.5rem; }
.block { margin-top:1.3rem; } .block:first-child { margin-top:0; }
.block .t { font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:.45rem; font-weight:600; }
.q, .a, .chunkbody { background:var(--surface-in); border:1px solid var(--hairline); border-radius:var(--radius-md); }
.q { padding:.8rem .95rem; color:var(--ink); font-size:.9rem; }
.a { padding:.8rem .95rem; max-height:240px; overflow-y:auto; white-space:pre-wrap; color:var(--ink-soft); font-size:.9rem; }
.c { border-left:3px solid var(--gold); padding:.45rem 0 .45rem .9rem; color:#6b5400; font-style:italic; font-size:.9rem; }
.badge { display:inline-block; font-size:.66rem; padding:.14rem .55rem; border-radius:var(--radius-pill); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
.b-pos { background:var(--good-bg); color:var(--good); }
.b-mid { background:var(--mid-bg); color:var(--mid); }
.b-neg { background:var(--bad-bg); color:var(--bad); }

/* Sources & chunks */
.srccard { display:flex; align-items:center; gap:.8rem; margin-top:.6rem; background:var(--surface-in); border:1px solid var(--hairline); border-radius:var(--radius-md); padding:.7rem .9rem; }
.srccard .ic { width:34px; height:34px; border-radius:8px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:.62rem; font-weight:700; background:var(--bad-bg); color:var(--bad); }
.srccard .fn { font-weight:600; font-size:.85rem; color:var(--ink); }
.srccard .fm { color:var(--ink-faint); font-size:.74rem; }
.srccard a { margin-left:auto; background:var(--accent); color:#fff; text-decoration:none; font-size:.76rem; font-weight:600; padding:.45rem .8rem; border-radius:var(--radius-sm); white-space:nowrap; transition:background .15s; box-shadow:0 1px 2px rgba(0,0,80,.18); }
.srccard a:hover { background:var(--accent-hover); color:#fff; }
.nosrc { color:var(--ink-faint); font-size:.85rem; margin-top:.6rem; }
.chunk-wrap { margin-top:.5rem; border:1px solid var(--hairline); border-radius:var(--radius-sm); overflow:hidden; background:var(--surface-in); }
.chunk-summary { cursor:pointer; padding:.55rem .8rem; font-size:.78rem; color:var(--ink-faint); font-weight:600; user-select:none; display:flex; align-items:center; gap:.45rem; list-style:none; }
.chunk-summary::-webkit-details-marker { display:none; }
.chunk-summary:hover { color:var(--accent); }
.chunk-summary::before { content:'▶'; font-size:.5rem; transition:transform .15s; color:var(--ink-ghost); }
details[open] > .chunk-summary::before { transform:rotate(90deg); color:var(--accent); }
.chunkbody { padding:.7rem .9rem; font-size:.82rem; white-space:pre-wrap; border-top:1px solid var(--hairline); border-radius:0; color:var(--ink-soft); line-height:1.6; max-height:220px; overflow-y:auto; }

@media (max-width:900px) {
  .kpis { grid-template-columns:repeat(2,1fr); }
  .charts { grid-template-columns:1fr; }
  .md { grid-template-columns:1fr; }
  .list { max-height:380px; }
}
</style>
</head>
<body>
<nav id="main-nav"></nav>
<main>
  <h1>Notes des utilisateurs</h1>
  <p class="sub" id="sub">Chargement…</p>

  <section class="kpis" id="kpis" aria-label="Indicateurs clés"></section>

  <section class="charts">
    <div class="card"><h3>Répartition des notes</h3><div id="dist"></div></div>
    <div class="card"><h3>Moyenne quotidienne — 30 derniers jours</h3><svg class="spark" id="spark" viewBox="0 0 600 175" preserveAspectRatio="none" role="img" aria-label="Évolution quotidienne de la note moyenne sur les 30 derniers jours"></svg></div>
  </section>

  <div class="toolbar">
    <div class="seg" id="seg" role="group" aria-label="Filtres">
      <button data-f="all" class="on">Toutes</button>
      <button data-f="pos">≥ 4★</button>
      <button data-f="neg">≤ 2★</button>
      <button data-f="com">Avec commentaire</button>
    </div>
    <input class="search" id="search" type="search" aria-label="Rechercher une note" placeholder="Rechercher (question, réponse, commentaire, utilisateur)…">
  </div>

  <div class="md">
    <div class="list" id="list" aria-label="Liste des notes"></div>
    <div class="detail" id="detail"></div>
  </div>
</main>

<script src="/admin/app.js"></script>
<script>
/* ---- Utilitaires ---- */
function initials(e) {
  var s = (e || '').split('@')[0].split('.');
  return s.map(function(p) { return p[0] || ''; }).join('').slice(0, 2).toUpperCase() || '?';
}
/* Avatar : teinte déterministe dans la famille bleue (sobre, cohérent DSFR). */
function avatarColor(e) {
  var h = 0;
  for (var i = 0; i < (e||'').length; i++) h = (h * 31 + e.charCodeAt(i)) % 360;
  var hue = 214 + (h % 40); /* 214–254 : bleus / indigos */
  return 'hsl(' + hue + ',40%,44%)';
}
function fmtDate(d) {
  return new Date(d).toLocaleString('fr', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

/* Crée un élément <span class="stars"> à partir d'un entier 1-5 */
function starsEl(n) {
  var wrap = createEl('span', { className: 'stars' });
  for (var i = 1; i <= 5; i++) {
    wrap.appendChild(createEl('span', { className: (i <= n ? 'f' : 'e'), textContent: '★' }));
  }
  return wrap;
}

/* Badge sentiment */
function badgeEl(r) {
  var cls = r >= 4 ? 'badge b-pos' : r >= 3 ? 'badge b-mid' : 'badge b-neg';
  var txt = r >= 4 ? 'positif' : r >= 3 ? 'neutre' : 'négatif';
  return createEl('span', { className: cls, textContent: txt });
}

/* Extrait les sources citées depuis le texte markdown d'une réponse.
   Ne retient que les liens /v1/source/… (palier 1 : liens en clair, pas de vérif de sig).
   La vérification de signature est assurée par le backend au palier 2. */
function citedSources(answer) {
  var re = /\[([^\]]+)\]\((\/v1\/source\/[^)\s]+)\)/g;
  var out = [], seen = {}, m;
  while ((m = re.exec(answer || '')) !== null) {
    var name = m[1].replace(/\\(.)/g, '$1');
    if (seen[m[2]]) continue;
    seen[m[2]] = 1;
    out.push({ name: name, href: m[2] });
  }
  return out;
}

/* ---- État global ---- */
var ITEMS = [];
var current = null;
var filter = 'all';
var searchQ = '';
var tab = 'rep';
/* Cache des résultats /admin/ratings/:id/sources (par id de note) */
var _srcCache = {};

/* ---- KPIs ---- */
function renderKpis(stats) {
  var el = document.getElementById('kpis');
  clearEl(el);
  if (!stats) return;

  function kpiCard(label, valNode, trendNode) {
    var card = createEl('div', { className: 'card kpi' });
    card.appendChild(createEl('div', { className: 'label', textContent: label }));
    var valDiv = createEl('div', { className: 'val' });
    valDiv.appendChild(valNode);
    card.appendChild(valDiv);
    if (trendNode) card.appendChild(trendNode);
    return card;
  }

  /* Total notes */
  var v1 = createEl('span', { textContent: String(stats.count) });
  var t1 = createEl('div', { className: 'trendpill' + (stats.week > 0 ? ' up' : ''), textContent: (stats.week > 0 ? '▲ ' : '') + stats.week + ' cette semaine' });
  el.appendChild(kpiCard('Total notes', v1, t1));

  /* Moyenne */
  var v2s = createEl('span', { textContent: String((stats.average || 0).toFixed(2)) });
  var v2sm = createEl('small', { textContent: ' / 5' });
  v2s.appendChild(v2sm);
  var v2wrap = createEl('span');
  v2wrap.appendChild(v2s);
  var t2 = createEl('div', { className: 'trendpill', textContent: 'sur l\'ensemble des notes' });
  el.appendChild(kpiCard('Moyenne', v2wrap, t2));

  /* % satisfaits */
  var v3s = createEl('span', { textContent: String(stats.pct_high) });
  var v3sm = createEl('small', { textContent: ' %' });
  v3s.appendChild(v3sm);
  var v3wrap = createEl('span');
  v3wrap.appendChild(v3s);
  var highCount = stats.distribution ? (stats.distribution[3] + stats.distribution[4]) : 0;
  var t3 = createEl('div', { className: 'trendpill', textContent: highCount + ' notes ≥ 4★' });
  el.appendChild(kpiCard('% satisfaits (≥ 4★)', v3wrap, t3));

  /* Notes cette semaine */
  var v4 = createEl('span', { textContent: String(stats.week) });
  var t4 = createEl('div', { className: 'trendpill', textContent: 'sur les 7 derniers jours' });
  el.appendChild(kpiCard('Notes cette semaine', v4, t4));
}

/* ---- Répartition ---- */
function renderDist(distribution) {
  var el = document.getElementById('dist');
  clearEl(el);
  if (!distribution) return;
  var max = Math.max.apply(null, distribution) || 1;
  for (var s = 5; s >= 1; s--) {
    var cnt = distribution[s - 1];
    var row = createEl('div', { className: 'distrow' });
    row.appendChild(createEl('span', { className: 'lab', textContent: s + '★' }));
    var bar = createEl('span', { className: 'bar' });
    var fill = createEl('i');
    fill.style.width = (cnt / max * 100) + '%';
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(createEl('span', { className: 'cnt', textContent: String(cnt) }));
    el.appendChild(row);
  }
}

/* ---- Tendance (SVG — valeurs numériques uniquement, pas de données utilisateur) ---- */
function renderSpark(trend) {
  var el = document.getElementById('spark');
  /* Le SVG ne contient que des nombres calculés, pas de données texte utilisateur.
     On peut utiliser innerHTML ici car toutes les valeurs sont numériques (toFixed). */
  if (!trend || trend.length < 2) {
    el.innerHTML = '<text x="300" y="80" text-anchor="middle" fill="#929299" font-size="12">Données insuffisantes</text>';
    return;
  }
  var W = 600, H = 175, padLeft = 25, padRight = 10, padTop = 10, padBottom = 30, n = trend.length;
  var pts = trend.map(function(t) { return t.avg; });
  function x(i) { return padLeft + i * (W - padLeft - padRight) / (n - 1); }
  function y(v) { return H - padBottom - (v - 1) / 4 * (H - padTop - padBottom); }
  function dateLabel(iso) {
    var parts = String(iso || '').split('-');
    return parts.length === 3 ? parts[2] + '/' + parts[1] : '';
  }
  var line = pts.map(function(v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
  var area = line + ' L' + x(n - 1).toFixed(1) + ' ' + (H - padBottom) + ' L' + x(0).toFixed(1) + ' ' + (H - padBottom) + ' Z';
  var dots = pts.map(function(v, i) {
    return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3" fill="#000091"><title>' + dateLabel(trend[i].date) + ' : ' + Number(v).toFixed(2) + '/5 (' + Number(trend[i].count) + ' note(s))</title></circle>';
  }).join('');
  var grid = '';
  [1, 2, 3, 4, 5].forEach(function(v) {
    grid += '<line x1="' + padLeft + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - padRight) + '" y2="' + y(v).toFixed(1) + '" stroke="rgba(20,20,60,0.08)"/>';
    grid += '<text x="2" y="' + (y(v) + 4).toFixed(1) + '" fill="#929299" font-size="10">' + v + '</text>';
  });
  var labelIndexes = [0, Math.floor((n - 1) / 2), n - 1].filter(function(v, i, a) { return a.indexOf(v) === i; });
  var labels = labelIndexes.map(function(i) {
    var anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
    return '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor + '" fill="#929299" font-size="10">' + dateLabel(trend[i].date) + '</text>';
  }).join('');
  el.innerHTML =
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#000091" stop-opacity="0.16"/>' +
    '<stop offset="1" stop-color="#000091" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    grid +
    '<path d="' + area + '" fill="url(#g)"/>' +
    '<path d="' + line + '" fill="none" stroke="#000091" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + labels;
}

/* ---- Filtrage ---- */
function filtered() {
  return ITEMS.filter(function(r) {
    if (filter === 'pos' && r.rating < 4) return false;
    if (filter === 'neg' && r.rating > 2) return false;
    if (filter === 'com' && !r.comment) return false;
    if (searchQ) {
      var hay = ((r.email || r.sub || '') + ' ' + (r.question || '') + ' ' + (r.answer || '') + ' ' + (r.comment || '')).toLowerCase();
      if (hay.indexOf(searchQ.toLowerCase()) < 0) return false;
    }
    return true;
  }).sort(function(a, b) { return a.created_at < b.created_at ? 1 : -1; });
}

/* ---- Liste ---- */
function renderList() {
  var rows = filtered();
  var el = document.getElementById('list');
  clearEl(el);

  if (!rows.length) {
    el.appendChild(createEl('div', { style: 'padding:24px;color:var(--ink-faint);font-size:.85rem', textContent: 'Aucune note.' }));
    renderDetail(null);
    return;
  }

  if (!current || !rows.some(function(r) { return r.id === current; })) {
    current = rows[0].id;
  }

  rows.forEach(function(r) {
    var email = r.email || r.sub || '(inconnu)';
    var pseudo = email.split('@')[0];

    var item = createEl('div', { className: 'item' + (r.id === current ? ' on' : '') });
    item.dataset.id = r.id;

    var av = createEl('div', { className: 'avatar', textContent: initials(email) });
    av.style.background = avatarColor(email);
    item.appendChild(av);

    var info = createEl('div', { style: 'min-width:0;flex:1' });

    var topRow = createEl('div', { style: 'display:flex;justify-content:space-between;gap:8px;align-items:center' });
    topRow.appendChild(createEl('span', { className: 'who', textContent: pseudo }));
    topRow.appendChild(starsEl(r.rating));
    info.appendChild(topRow);

    info.appendChild(createEl('div', { className: 'meta', textContent: fmtDate(r.created_at) }));

    var snip = createEl('div', { className: 'snip' });
    if (r.comment) {
      snip.appendChild(createEl('em', { textContent: '💬 ' + r.comment }));
    } else {
      snip.appendChild(createEl('em', { textContent: 'sans commentaire' }));
    }
    info.appendChild(snip);
    item.appendChild(info);

    item.onclick = function() {
      current = Number(item.dataset.id);
      tab = 'rep';
      renderList();
    };
    el.appendChild(item);
  });

  renderDetail(ITEMS.filter(function(r) { return r.id === current; })[0] || null);
}

/* ---- Détail ---- */
function renderDetail(r) {
  var el = document.getElementById('detail');
  clearEl(el);

  if (!r) {
    el.appendChild(createEl('div', { className: 'pane', style: 'color:var(--ink-faint);font-size:.85rem', textContent: 'Sélectionnez une note.' }));
    return;
  }

  var email = r.email || r.sub || '(inconnu)';

  /* En-tête */
  var dhead = createEl('div', { className: 'dhead' });
  var top = createEl('div', { className: 'top' });

  var leftInfo = createEl('div');
  leftInfo.appendChild(createEl('div', { className: 'who2', textContent: email }));
  var meta2 = createEl('div', { className: 'meta2' });
  meta2.appendChild(createEl('span', { textContent: fmtDate(r.created_at) }));
  meta2.appendChild(badgeEl(r.rating));
  leftInfo.appendChild(meta2);
  top.appendChild(leftInfo);

  var bigstars = createEl('div', { className: 'bigstars stars' });
  for (var i = 1; i <= 5; i++) {
    bigstars.appendChild(createEl('span', { className: (i <= r.rating ? 'f' : 'e'), textContent: '★' }));
  }
  top.appendChild(bigstars);
  dhead.appendChild(top);

  /* Onglets */
  var tabs = createEl('div', { className: 'tabs' });
  var btnRep = createEl('button', { textContent: 'Réponse' });
  btnRep.dataset.t = 'rep';
  if (tab === 'rep') btnRep.className = 'on';
  var btnSrc = createEl('button', { textContent: 'Sources & vérification' });
  btnSrc.dataset.t = 'src';
  if (tab === 'src') btnSrc.className = 'on';
  tabs.appendChild(btnRep);
  tabs.appendChild(btnSrc);
  dhead.appendChild(tabs);
  el.appendChild(dhead);

  /* Conteneur de l'onglet actif — remplacé de manière asynchrone si besoin */
  var paneContainer = createEl('div');
  el.appendChild(paneContainer);

  if (tab === 'rep') {
    paneContainer.appendChild(renderPaneRep(r));
  } else {
    renderPaneSrcAsync(r, paneContainer);
  }

  /* Gestion des clics d'onglets */
  tabs.querySelectorAll('button').forEach(function(b) {
    b.onclick = function() {
      tab = b.dataset.t;
      /* Mise à jour visuelle des onglets */
      tabs.querySelectorAll('button').forEach(function(x) { x.classList.remove('on'); });
      b.classList.add('on');
      /* Remplacement du contenu */
      clearEl(paneContainer);
      if (tab === 'rep') {
        paneContainer.appendChild(renderPaneRep(r));
      } else {
        renderPaneSrcAsync(r, paneContainer);
      }
    };
  });
}

/* Onglet Réponse — 100 % createEl, jamais innerHTML avec données */
function renderPaneRep(r) {
  var pane = createEl('div', { className: 'pane' });

  /* Question */
  var bQ = createEl('div', { className: 'block' });
  bQ.appendChild(createEl('div', { className: 't', textContent: 'Question' }));
  bQ.appendChild(createEl('div', { className: 'q', textContent: r.question || '(aucune question enregistrée)' }));
  pane.appendChild(bQ);

  /* Réponse */
  var bA = createEl('div', { className: 'block' });
  bA.appendChild(createEl('div', { className: 't', textContent: 'Réponse de l\'assistant' }));
  bA.appendChild(createEl('div', { className: 'a', textContent: r.answer || '(aucune réponse enregistrée)' }));
  pane.appendChild(bA);

  /* Commentaire (optionnel) */
  if (r.comment) {
    var bC = createEl('div', { className: 'block' });
    bC.appendChild(createEl('div', { className: 't', textContent: 'Commentaire de l\'utilisateur' }));
    bC.appendChild(createEl('div', { className: 'c', textContent: r.comment }));
    pane.appendChild(bC);
  }

  return pane;
}

/* Onglet Sources (Palier 2) — chargement à la demande depuis /admin/ratings/:id/sources.
   Affiche le nom du PDF, son état, le lien visionneuse et les chunks cités (texte dépliable).
   Met en cache le résultat par id de note pour éviter les rechargements. */
function renderPaneSrcAsync(r, container) {
  var id = r.id;
  var pane = createEl('div', { className: 'pane' });
  var bSrc = createEl('div', { className: 'block' });
  bSrc.appendChild(createEl('div', { className: 't', textContent: 'Documents cités' }));
  pane.appendChild(bSrc);
  container.appendChild(pane);

  /* Si déjà en cache, afficher directement */
  if (_srcCache[id] !== undefined) {
    _renderSrcContent(bSrc, _srcCache[id]);
    return;
  }

  /* Indicateur de chargement */
  var loading = createEl('div', { className: 'nosrc', textContent: 'Chargement…' });
  bSrc.appendChild(loading);

  apiGet('/admin/ratings/' + id + '/sources').then(function(d) {
    /* Stocker en cache (même si vide) */
    _srcCache[id] = d;
    /* Retirer le loader */
    bSrc.removeChild(loading);
    _renderSrcContent(bSrc, d);
  }).catch(function(err) {
    bSrc.removeChild(loading);
    var msg = createEl('div', { className: 'nosrc' });
    msg.textContent = 'Erreur lors du chargement des sources.';
    bSrc.appendChild(msg);
  });
}

/* Construit le contenu des sources dans le bloc bSrc à partir de la réponse API.
   Réponse attendue : { sources:[{documentId, filename, status, href, chunks:[{id,content}]}], note? }
   Toutes les données texte sont insérées via textContent — jamais innerHTML. */
function _renderSrcContent(bSrc, d) {
  var srcs = (d && d.sources) || [];
  var note = d && d.note;

  if (!srcs.length) {
    var msg = createEl('div', { className: 'nosrc' });
    msg.textContent = note || 'Aucune source citée dans cette réponse.';
    bSrc.appendChild(msg);
    return;
  }

  srcs.forEach(function(src) {
    /* Carte principale */
    var card = createEl('div', { className: 'srccard' });

    var ic = createEl('div', { className: 'ic', textContent: 'PDF' });
    card.appendChild(ic);

    var info = createEl('div', { style: 'min-width:0;flex:1' });
    info.appendChild(createEl('div', { className: 'fn', textContent: src.filename }));
    if (src.status) {
      info.appendChild(createEl('div', { className: 'fm', textContent: src.status }));
    }
    card.appendChild(info);

    var lien = createEl('a', { href: src.href, target: '_blank', textContent: 'Voir le PDF surligné ↗' });
    card.appendChild(lien);

    bSrc.appendChild(card);

    /* Chunks cités (dépliables) */
    var chunks = (src.chunks && src.chunks.length) ? src.chunks : null;
    if (!chunks) {
      var noChunk = createEl('div', { style: 'color:var(--ink-faint);font-size:.74rem;margin:.4rem 0 .5rem .25rem',
        textContent: '(texte des chunks indisponible)' });
      bSrc.appendChild(noChunk);
    } else {
      chunks.forEach(function(ch, idx) {
        var details = createEl('details');
        details.className = 'chunk-wrap';
        var summary = createEl('summary');
        summary.className = 'chunk-summary';
        summary.textContent = 'Passage ' + (idx + 1);
        details.appendChild(summary);
        var body = createEl('div', { className: 'chunkbody' });
        body.textContent = ch.content;
        details.appendChild(body);
        bSrc.appendChild(details);
      });
    }
  });

  /* Si la clé `note` est présente ET qu'il y a des sources, afficher la note en bas */
  if (note) {
    var noteEl = createEl('div', { style: 'margin-top:.7rem;color:var(--ink-faint);font-size:.74rem' });
    noteEl.textContent = note;
    bSrc.appendChild(noteEl);
  }
}

/* ---- Initialisation ---- */
(async function() {
  await checkAuth();
  buildNav('ratings');

  var stats = await apiGet('/admin/ratings/stats');
  var data = await apiGet('/admin/ratings?limit=500');
  ITEMS = (data && data.items) || [];

  /* Sous-titre */
  var sub = document.getElementById('sub');
  sub.textContent = ITEMS.length + ' note(s) chargée(s) — tableau de bord de satisfaction & vérification des sources.';

  renderKpis(stats);
  renderDist(stats && stats.distribution);
  renderSpark(stats && stats.trend);
  renderList();

  /* Filtres */
  document.getElementById('seg').onclick = function(e) {
    if (e.target.tagName !== 'BUTTON') return;
    [].forEach.call(this.children, function(b) { b.classList.remove('on'); });
    e.target.classList.add('on');
    filter = e.target.dataset.f;
    renderList();
  };

  /* Recherche */
  document.getElementById('search').oninput = function() {
    searchQ = this.value;
    renderList();
  };
})();
</script>
