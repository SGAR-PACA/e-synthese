<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Synthese Admin - Mot de passe oublié</title>
  <link rel="stylesheet" href="/admin/pico.min.css">
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <div class="login-container">
    <h2>Réinitialiser le mot de passe</h2>
    <p>Utilisez votre code de récupération pour définir un nouveau mot de passe.</p>
    <div id="msg" class="message"></div>

    <div id="recovery-box" style="display:none; background:#fffbe6; border:2px solid #f0c000; border-radius:8px; padding:1rem; margin:1rem 0;">
      <strong>Nouveau code de récupération</strong>
      <p>Notez ce code precieusement, il ne sera plus jamais affiche.</p>
      <code id="recovery-code" style="font-size:1.3rem; display:block; margin:0.5rem 0;"></code>
    </div>

    <form id="form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="votre@email.com">

      <label for="recovery-input">Code de récupération</label>
      <input type="text" id="recovery-input" name="recovery-input" required placeholder="Votre code de récupération">

      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" name="password" required minlength="8" placeholder="Nouveau mot de passe">

      <label for="password2">Confirmer le nouveau mot de passe</label>
      <input type="password" id="password2" name="password2" required minlength="8" placeholder="Confirmer">

      <button type="submit">Réinitialiser</button>
    </form>

    <p style="margin-top:1rem; text-align:center;">
      <a href="/admin/login">Retour a la connexion</a>
    </p>
  </div>
  <script src="/admin/app.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value;
      var recoveryCode = document.getElementById('recovery-input').value;
      var password = document.getElementById('password').value;
      var password2 = document.getElementById('password2').value;

      var pwError = validatePasswordClient(password);
      if (pwError) {
        showMessage('msg', pwError, true);
        return;
      }

      if (password !== password2) {
        showMessage('msg', 'Les mots de passe ne correspondent pas.', true);
        return;
      }

      var res = await fetch('/admin/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, recoveryCode: recoveryCode, newPassword: password })
      });
      var data = await res.json();

      if (data.ok) {
        document.getElementById('form').style.display = 'none';
        if (data.recoveryCode) {
          document.getElementById('recovery-code').textContent = data.recoveryCode;
          document.getElementById('recovery-box').style.display = 'block';
        }
        showMessage('msg', 'Mot de passe réinitialisé avec succès.', false);
      } else {
        var errorMsg = data.error || 'Erreur lors de la réinitialisation';
        errorMsg += '\nCode perdu ? Contactez l\'administrateur.';
        showMessage('msg', errorMsg, true);
      }
    });
  </script>
</body>
</html>
