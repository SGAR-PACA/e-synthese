<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Synthese Admin - Reinitialisation</title>
  <link rel="stylesheet" href="/admin/pico.min.css">
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <div class="login-container">
    <h2>Definir un nouveau mot de passe</h2>
    <p>Ce lien a ete genere par un administrateur.</p>
    <div id="msg" class="message"></div>

    <div id="recovery-box" style="display:none; background:#fffbe6; border:2px solid #f0c000; border-radius:8px; padding:1rem; margin:1rem 0;">
      <strong>Nouveau code de recuperation</strong>
      <p>Notez ce code precieusement, il ne sera plus jamais affiche.</p>
      <code id="recovery-code" style="font-size:1.3rem; display:block; margin:0.5rem 0;"></code>
    </div>

    <form id="form">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" name="password" required minlength="8" placeholder="Nouveau mot de passe">

      <label for="password2">Confirmer le nouveau mot de passe</label>
      <input type="password" id="password2" name="password2" required minlength="8" placeholder="Confirmer">

      <button type="submit">Reinitialiser</button>
    </form>

    <p id="login-link" style="display:none; margin-top:1rem; text-align:center;">
      <a href="/admin/login">Retour a la connexion</a>
    </p>
  </div>
  <script src="/admin/app.js"></script>
  <script>
    var resetToken = null;

    (function() {
      var params = new URLSearchParams(location.search);
      resetToken = params.get('token');
      if (!resetToken) {
        showMessage('msg', 'Lien invalide : aucun token fourni.', true);
        document.getElementById('form').style.display = 'none';
      }
    })();

    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var password = document.getElementById('password').value;
      var password2 = document.getElementById('password2').value;

      var pwError = validatePasswordClient(password);
      if (pwError) {
        showMessage('msg', pwError, true);
        return;
      }

      if (password !== password2) {
        showMessage('msg', 'Les mots de passe ne correspondent pas.', true);
        return;
      }

      var res = await fetch('/admin/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: resetToken, newPassword: password })
      });
      var data = await res.json();

      if (data.ok) {
        document.getElementById('form').style.display = 'none';
        if (data.recoveryCode) {
          document.getElementById('recovery-code').textContent = data.recoveryCode;
          document.getElementById('recovery-box').style.display = 'block';
        }
        showMessage('msg', 'Mot de passe reinitialise avec succes.', false);
        document.getElementById('login-link').style.display = 'block';
      } else {
        showMessage('msg', data.error || 'Erreur : lien expire ou invalide.', true);
      }
    });
  </script>
</body>
</html>
