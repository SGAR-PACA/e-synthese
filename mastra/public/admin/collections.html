<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Synthese Admin - Collections</title>
  <link rel="stylesheet" href="/admin/pico.min.css">
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <h2>Collections</h2>
  <div id="msg" class="message"></div>
  <p>Créez une collection par administration. L'accès est piloté par les <a href="/admin/groups">groupes</a> : chaque groupe voit les collections qui lui sont affectées.</p>
  <div id="collections-list"><p aria-busy="true">Chargement des collections...</p></div>
  <hr>
  <details>
    <summary>Créer une nouvelle collection</summary>
    <form id="create-form" style="margin-top:1rem;">
      <label for="col-name">Nom</label>
      <input type="text" id="col-name" required>
      <label for="col-desc">Description</label>
      <input type="text" id="col-desc">
      <button type="submit">Créer</button>
    </form>
  </details>
  <script src="/admin/app.js"></script>
  <script>
    async function loadCollections() {
      var collections = await apiGet('/v1/collections');
      var container = document.getElementById('collections-list');
      clearEl(container);
      var items = (collections && collections.data) || [];
      if (!items.length) {
        container.appendChild(createEl('p', { textContent: 'Aucune collection trouvee. Verifiez votre cle API.' }));
        return;
      }
      items.forEach(function(col) {
        var card = createEl('div', { className: 'collection-card' }, [
          createEl('div', {}, [
            createEl('strong', { textContent: col.name }),
            document.createTextNode(' (ID: ' + col.id + ')'),
            createEl('br'),
            createEl('small', { textContent: col.description || 'Pas de description' }),
          ]),
          createEl('button', { className: 'outline secondary', textContent: 'Supprimer', onClick: function() { deleteCollection(col.id); } }),
        ]);
        container.appendChild(card);
      });
    }

    document.getElementById('create-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var name = document.getElementById('col-name').value;
      var description = document.getElementById('col-desc').value;
      var result = await apiPost('/v1/collections', { name: name, description: description });
      if (result && (result.id || result.data)) {
        showMessage('msg', 'Collection créée.', false);
        document.getElementById('col-name').value = '';
        document.getElementById('col-desc').value = '';
        await loadCollections();
      } else {
        showMessage('msg', (result && result.detail) || 'Erreur lors de la creation', true);
      }
    });

    async function deleteCollection(id) {
      if (!confirm('Supprimer cette collection ? Cette action est irréversible.')) return;
      await apiDelete('/v1/collections/' + id);
      await loadCollections();
      showMessage('msg', 'Collection supprimée.', false);
    }

    (async function() {
      await checkAuth();
      buildNav('collections');
      await loadCollections();
    })();
  </script>
</body>
</html>
