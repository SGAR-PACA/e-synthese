<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Synthese Admin - Audit</title>
  <link rel="stylesheet" href="/admin/pico.min.css">
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <h2>Journal d'audit</h2>
  <div id="msg" class="message"></div>
  <table role="grid">
    <thead>
      <tr>
        <th>Date</th>
        <th>Action</th>
        <th>Utilisateur</th>
        <th>IP</th>
        <th>Détails</th>
      </tr>
    </thead>
    <tbody id="audit-body"><tr><td colspan="5">Chargement...</td></tr></tbody>
  </table>
  <script src="/admin/app.js"></script>
  <script>
    (async function() {
      await checkAuth();
      buildNav('audit');

      var audit = await apiGet('/admin/audit?limit=100');
      var body = document.getElementById('audit-body');
      clearEl(body);
      if (audit && audit.length) {
        audit.forEach(function(e) {
          body.appendChild(createEl('tr', {}, [
            createEl('td', { textContent: new Date(e.timestamp).toLocaleString('fr') }),
            createEl('td', { textContent: e.action }),
            createEl('td', { textContent: e.user_email || '-' }),
            createEl('td', { textContent: e.ip }),
            createEl('td', { textContent: e.details || '-' }),
          ]));
        });
      } else {
        body.appendChild(createEl('tr', {}, [createEl('td', { colspan: '5', textContent: 'Aucune activité enregistrée' })]));
      }
    })();
  </script>
</body>
</html>
