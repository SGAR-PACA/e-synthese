server {
  listen 8080;
  listen 3000;
  server_name localhost;

  # Docker embedded DNS resolver (127.0.0.11) — résout les noms de services
  # à la volée au lieu d'au démarrage, ce qui évite que nginx crash si
  # app-dev n'est pas encore enregistré dans Docker DNS au boot.
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;

  location /api/ {
    # set + variable force nginx à utiliser le resolver à chaque requête
    set $upstream_app_dev "app-dev:8000";
    proxy_pass http://$upstream_app_dev;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # IMPORTANT : on force https (au lieu de $scheme = http interne) parce que
    # Traefik fait le TLS devant nous. Sans ça, Django Production redirige en boucle
    # vers HTTPS car il croit recevoir du HTTP "client".
    proxy_set_header X-Forwarded-Proto https;

    # SSE (streaming chat /v1/chat/completions relayé par Django) : sans ça nginx
    # met la réponse en mémoire tampon et la livre d'un bloc à la fin, au lieu de
    # la streamer mot à mot. Mastra envoie aussi `X-Accel-Buffering: no` en renfort.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri index.html $uri/ =404;
  }

  location ~ "^/chat/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
    try_files $uri /chat/[id]/index.html;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
